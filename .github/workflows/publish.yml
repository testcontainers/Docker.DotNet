name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json
      NUGET_USER: HofmeisterAn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x
      - name: Install NBGV tool
        run: dotnet tool install --tool-path . nbgv
      - name: Set Version
        run: ./nbgv cloud
      - name: Create Packages
        run: dotnet pack -c Release -o packages -p:ContinuousIntegrationBuild=true
      - name: NuGet Login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}
      - name: Push packages to NuGet.org
        run: dotnet nuget push ./packages/Docker.DotNet.*.nupkg --skip-duplicate -k "$NUGET_API_KEY" -s "$NUGET_SOURCE"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      - name: Create Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            return github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            })
